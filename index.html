    <!-- Set lang+dir before paint to match the user's saved/browser locale. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('vibe_lang');
          var lang = (saved === 'he' || saved === 'ar' || saved === 'en')
            ? saved
            : (function () {
                var b = (navigator.language || 'en').split('-')[0];
                return (b === 'he' || b === 'ar') ? b : 'en';
              })();
          document.documentElement.lang = lang;
          document.documentElement.dir = lang === 'en' ? 'ltr' : 'rtl';
        } catch (e) {}
      })();
    </script>
