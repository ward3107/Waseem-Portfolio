    <!-- Set lang+dir before paint to match the user's saved/browser locale. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('vibe_lang');
          var lang = (saved === 'he' || saved === 'ar' || saved === 'en')
            ? saved
            : (function () {
                var b = (navigator.language || 'en').split('-')[0];
                return (b === 'he' || b === 'ar') ? b : 'en';
              })();
          document.documentElement.lang = lang;
          document.documentElement.dir = lang === 'en' ? 'ltr' : 'rtl';
        } catch (e) {}
      })();
    </script>
    <!-- Always open at the top. Runs before React/the router so there's no
         fragment for the browser to scroll to: strip any leftover section
         hash (e.g. /#what-i-do from a previous nav click) and take scroll
         restoration away from the browser so it can't reapply a scrolled-down
         position across SPA navigation. In-app section navigation is handled
         client-side by the router after load, so this doesn't affect it. -->
    <script>
      (function () {
        try {
          if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
          if (window.location.hash) {
            history.replaceState(null, '', window.location.pathname + window.location.search);
          }
        } catch (e) {}
      })();
    </script>
