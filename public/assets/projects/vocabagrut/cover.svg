    <path d="M20 55 L60 40 L100 55 L60 70 Z" fill="white" opacity="0.95"/>
    <path d="M45 68 L45 85 Q60 92 75 85 L75 68" stroke="white" stroke-width="4" fill="none" opacity="0.9"/>
    <circle cx="98" cy="58" r="3" fill="white"/>
    <line x1="98" y1="60" x2="98" y2="80" stroke="white" stroke-width="2"/>
  </g>
  <text x="220" y="175" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="66" font-weight="900" fill="white" letter-spacing="-1">VocaBagrut</text>
  <text x="80" y="330" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="64" font-weight="800" fill="white" letter-spacing="-1.5">Build English Bagrut exams</text>
  <text x="80" y="405" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="64" font-weight="800" fill="#c7d2fe" letter-spacing="-1.5">in minutes, not hours.</text>
  <text x="80" y="490" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="30" font-weight="500" fill="#e0e7ff" opacity="0.9">AI-powered · Aligned with MoE curriculum · 3, 4, and 5 units</text>
