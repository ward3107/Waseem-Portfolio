<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title description">
  <title id="title">Waseem Studio WordPress portfolio preview</title>
  <desc id="description">Dark modern portfolio interface with blue and violet accents.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b18"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
  </defs>
  <rect width="1200" height="800" rx="36" fill="url(#bg)"/>
  <circle cx="980" cy="110" r="190" fill="#7c3aed" opacity=".2" filter="url(#glow)"/>
  <circle cx="160" cy="720" r="170" fill="#06b6d4" opacity=".15" filter="url(#glow)"/>
  <rect x="44" y="36" width="1112" height="728" rx="28" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <circle cx="78" cy="72" r="7" fill="#fb7185"/><circle cx="102" cy="72" r="7" fill="#fbbf24"/><circle cx="126" cy="72" r="7" fill="#34d399"/>
  <text x="170" y="80" fill="#f8fafc" font-family="Arial, sans-serif" font-size="22" font-weight="700">WASEEM STUDIO</text>
  <text x="1075" y="80" text-anchor="end" fill="#94a3b8" font-family="Arial, sans-serif" font-size="16">WORK  ·  SERVICES  ·  CONTACT</text>
  <rect x="88" y="144" width="500" height="10" rx="5" fill="url(#accent)"/>
  <text x="88" y="235" fill="#f8fafc" font-family="Arial, sans-serif" font-size="55" font-weight="800">DIGITAL WORK</text>
  <text x="88" y="296" fill="#a5b4fc" font-family="Arial, sans-serif" font-size="55" font-weight="800">THAT FEELS ALIVE.</text>
  <text x="88" y="353" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="19">A multilingual WordPress portfolio crafted with Gutenberg.</text>
  <rect x="88" y="410" width="190" height="58" rx="29" fill="url(#accent)"/>
  <text x="183" y="447" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="18" font-weight="700">START A PROJECT</text>
  <g transform="translate(708 155)">
    <rect width="370" height="450" rx="26" fill="#111c35" stroke="#475569" stroke-width="2"/>
    <rect x="24" y="24" width="322" height="205" rx="18" fill="#1e293b"/>
    <circle cx="185" cy="126" r="74" fill="url(#accent)" opacity=".92"/>
    <path d="M145 126h80M185 86v80" stroke="white" stroke-width="16" stroke-linecap="round" opacity=".85"/>
    <rect x="24" y="258" width="180" height="18" rx="9" fill="#f8fafc"/>
    <rect x="24" y="292" width="286" height="10" rx="5" fill="#64748b"/>
    <rect x="24" y="316" width="248" height="10" rx="5" fill="#64748b"/>
    <rect x="24" y="366" width="104" height="40" rx="20" fill="#7c3aed"/>
    <rect x="142" y="366" width="104" height="40" rx="20" fill="#164e63"/>
  </g>
  <text x="88" y="700" fill="#64748b" font-family="Arial, sans-serif" font-size="18">WORDPRESS · GUTENBERG · RESPONSIVE DESIGN</text>
</svg>
