name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Typecheck, Lint, Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # Report high-severity advisories but don't block the build. Every
      # current react-router 7.x release is flagged by overlapping advisories
      # (GHSA-qwww-vcr4-c8h2 and the 6.0.0-7.17.0 cluster), all of which live
      # in SSR / RSC / framework-mode code paths. This is a client-only Vite
      # SPA using BrowserRouter/Routes/Link exclusively, so none of those paths
      # ship or execute. The scan stays visible in the log; revisit and drop
      # continue-on-error once react-router publishes a fully-patched line.
      - name: Audit production dependencies
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high
